</style></head><body><div id="app"></div><script>
const states = [
  ['poseOff','1 未启用'],
  ['poseConfig','2 待配置／待确认'],
  ['poseReady','3 已确认／待验证'],
  ['poseDone','4 抽验完成／可分析'],
  ['poseComplete','5 分析完成'],
  ['poseAnalysisPartial','6 分析异常']

const icons = {
  menu:'<path d="M4 5h16M4 12h11M4 19h16M17 9l4 3-4 3"/>',
  home:'<path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/>',

  project:'<path d="M4 4h13v14H4zM8 8h6M8 12h7M9 20h12V7"/>',
  users:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2c0-3 2-5 6-5s6 2 6 5v2M17 6a3 3 0 0 1 0 6M17 14c3 0 4 2 4 4v2"/>',
  chart:'<path d="M4 20V4M4 20h17M8 16v-4M13 16V7M18 16V9"/>'

const initialTargets = [
  {id:'cup',name:'杯子',desc:'白色陶瓷杯，带把手',on:true},
  {id:'bottle',name:'水瓶',desc:'透明塑料水瓶，蓝色瓶盖',on:true}

const ui = {
  state:'poseConfig',top:'配置',section:'预标注',cap:'pose',showStates:true,
  labelTab:'标签',legacyFile:null,legacyModel:'obstacle4D/v4.0.1',uploadCandidate:'',
  modal:null,beforeModal:null,removeIndex:null,previewOpen:false,toast:'',targets:[],enabled:true,model:'6D Pose v1.0.0',prompt:'',
  promptSaved:false,targetsSaved:false,confirmedSignature:null,validatedSignature:null,
  validationStatus:'none',analysisStatus:'none',analysisSignature:null,runningKind:null,runToken:0,
  analysisVariant:'partial',legacyToken:0,selectedTasks:['IMG-TASK-1001','IMG-TASK-1002'],analysisRange:'全部待分析图片任务',analysisTasks:[],analysisRiskAccepted:false,projection:true,schemeMenu:false,
  taskCategory:'cup',taskPose:{tx:'0.324',ty:'0.112',tz:'0.781',rx:'12.4',ry:'-3.2',rz:'88.0'},taskRemoved:false,taskMissing:false,taskSaved:false
};
const poseFieldLabels={tx:'位置 X',ty:'位置 Y',tz:'位置 Z',rx:'旋转 X',ry:'旋转 Y',rz:'旋转 Z'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function icon(name){return `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`}
function button(label,action,cls='',disabled=false){return `<button class="btn ${cls}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`}
function badge(text,kind=''){return `<span class="tag ${kind}">${text}</span>`}
function isPose(s=ui.state){return s.startsWith('pose')}
function configSignature(){return JSON.stringify({model:ui.model,prompt:ui.prompt.trim(),targets:ui.targets.map(t=>({id:t.id.trim(),name:t.name.trim(),desc:t.desc.trim(),on:t.on}))})}
function validTargets(){const ids=ui.targets.map(t=>t.id.trim());return ui.targets.some(t=>t.on)&&ui.targets.every(t=>t.id.trim()&&t.name.trim()&&(!t.on||t.desc.trim()))&&new Set(ids).size===ids.length}
function isConfirmed(){return ui.enabled&&!!ui.prompt.trim()&&ui.promptSaved&&ui.targetsSaved&&validTargets()&&ui.confirmedSignature===configSignature()}
function analysisRisk(){return !isValidated()?(ui.validationStatus==='failed'?'本次抽验失败，仍可继续批量分析。请确认风险。':ui.validationStatus==='terminated'?'本次抽验已终止，仍可继续批量分析。请确认风险。':'尚未完成当前配置的抽验，仍可直接批量分析。请确认风险。'):''}
function isValidated(){return isConfirmed()&&ui.validationStatus==='success'&&ui.validatedSignature===ui.confirmedSignature}
function activePoseState(){if(!ui.enabled)return 'poseOff';if(!isConfirmed())return 'poseConfig';if(['partial','failed','terminated'].includes(ui.analysisStatus)&&ui.analysisSignature===ui.confirmedSignature)return 'poseAnalysisPartial';if(ui.analysisStatus==='success'&&ui.analysisSignature===ui.confirmedSignature)return 'poseComplete';return isValidated()?'poseDone':'poseReady'}
function setState(s){
  ++ui.runToken;ui.state=s;ui.top='配置';ui.section=s==='scheme'?'项目方案':'预标注';
  ui.cap=isPose(s)?'pose':'legacy';ui.modal=null;ui.runningKind=null;
  if(s.startsWith('pose')&&!s.startsWith('poseTask')){
    ui.enabled=s!=='poseOff';ui.model='6D Pose v1.0.0';ui.prompt='';ui.promptSaved=false;
    ui.targets=[];ui.targetsSaved=false;ui.confirmedSignature=null;ui.validatedSignature=null;
    ui.validationStatus='none';ui.analysisStatus='none';ui.analysisSignature=null;ui.analysisVariant='partial';
    if(!['poseOff','poseConfig'].includes(s)){
      ui.prompt='请识别图片中的杯子和水瓶，并输出各目标的三维位置与朝向。';
      ui.promptSaved=true;ui.targets=structuredClone(initialTargets).map(t=>({...t,persisted:true}));ui.targetsSaved=true;ui.confirmedSignature=configSignature();
    }
    if(['poseDone','poseComplete','poseAnalysisPartial'].includes(s)){ui.validationStatus='success';ui.validatedSignature=ui.confirmedSignature}
    if(s==='poseComplete'){ui.analysisStatus='success';ui.analysisSignature=ui.confirmedSignature}
    if(s==='poseAnalysisPartial'){ui.analysisStatus='partial';ui.analysisSignature=ui.confirmedSignature}
  }
  if(s==='legacyUpload')ui.modal='legacyUpload';
  if(s==='legacyAnalyzeModal')ui.modal='legacyAnalyze';
  if(s==='legacyUploaded')ui.legacyFile='预标注.json';
  if(s==='legacyEmpty')ui.legacyFile=null;
  if(s==='poseTaskMissing'||s==='poseTaskAdmin')ui.taskMissing=true;
  if(s==='poseTaskEdit'||s==='poseTaskReview')ui.taskMissing=false;
  render();
}
function runSimulation(kind){
  const token=++ui.runToken;ui.runningKind=kind;
  if(kind==='verify')ui.validationStatus='running';else ui.analysisStatus='running';
  render();setTimeout(()=>{if(token!==ui.runToken)return;ui.runningKind=null;
    if(kind==='verify'){ui.validationStatus='success';ui.validatedSignature=ui.confirmedSignature}
    else{ui.analysisStatus='success';ui.analysisSignature=ui.confirmedSignature}
    render();
  },1000);
}
function toast(msg){ui.toast=msg;render();setTimeout(()=>{ui.toast='';render()},2400)}
function render(){

div><div class="footer-note">示例数值；坐标正方向、长度／角度单位及旋转表示待算法联调确认。</div><div class="notice ${ui.projection?'blue':'red'}">${ui.projection?'投影仅为示意；正式核对取决于相机参数与几何数据。':'缺少可用相机内参或角点：只能看位姿数值，无法在画面中投影核对。'}</div><div class="footer-note">模型：${esc(ui.model)} · VAL-IMG-001<br>抽验页没有编辑、保存、提交或应用入口。</div></aside></div></section>`;
}
function renderPictureTask(){const review=ui.state==='poseTaskReview';return `<section class="preview"><div class="preview-head"><div><strong>${review?'图片审核员复核':'图片正式标注任务'} · IMG-TASK-1001</strong> ${badge(review?'待审核':'可编辑',review?'orange':'green')}</div>${button('返回项目配置','backPictureConfig')}</div><div class="preview-body"><div class="stage-wrap"><div class="stage preview-image"><span class="watermark">示意图片 · 非真实算法结果</span><svg viewBox="0 0 900 540" aria-label="单图任务示意"><rect width="900" height="540" fill="#48515d"/><rect x="50" y="80" width="800" height="380" fill="#596472"/><path d="M45 414h815" stroke="#93a0a9" stroke-width="10"/><ellipse cx="450" cy="406" rx="95" ry="17" fill="#3f4650"/><path d="M398 305h105v100H398z" fill="#ebebea"/><ellipse cx="450" cy="305" rx="53" ry="11" fill="#fafaf8"/>${ui.taskRemoved?'':`<path d="M385 288h135v130H385z" stroke="#4fe1a0" stroke-width="3" fill="none"/><text x="530" y="300" fill="#b8f2d3" font-size="18">${esc(ui.taskCategory)} · obj_01</text>`}</svg></div><div class="timeline" style="height:74px"><div class="time-head"><span>IMG-001.jpg · 1920 × 1080</span><span>算法版本 RUN-IMG-6D-002</span></div><div class="footer-note">画面投影仅供核对，真实显示依赖内参与几何数据。</div></div></div><aside class="preview-side"><div class="panel-title">${review?'算法与人工结果对比':'已有实例核对'}</div><div class="frame-row">实例 obj_01 · 项目类别已确认</div>${review?`<table class="review-diff"><tr><th>字段</th><th>算法原值</th><th>人工结果</th></tr><tr><td>类别</td><td>cup</td><td>${esc(ui.taskCategory)}</td></tr><tr><td>位置 X（tx）</td><td>0.324</td><td>${esc(ui.taskPose.tx)}</td></tr><tr><td>误检剔除</td><td>否</td><td>${ui.taskRemoved?'是':'否'}</td></tr></table><div class="task-actions">${button('通过','pictureReviewApprove','primary')}${button('驳回','pictureReviewReject','danger')}</div>`:`<div class="field" style="display:block;margin:13px 0"><label>已有实例类别／名称</label><select id="pictureTaskCategory" style="width:100%;height:34px;margin-top:5px;border:1px solid #dce2eb"><option value="cup" ${ui.taskCategory==='cup'?'selected':''}>杯子 · cup</option><option value="bottle" ${ui.taskCategory==='bottle'?'selected':''}>水瓶 · bottle</option></select></div><div class="task-actions">${button(ui.taskRemoved?'恢复实例':'剔除误检','pictureFalsePositive','mini')}${button('登记漏检','pictureReportMissing','mini')}${button('重置算法原值','pictureResetPose','mini')}</div>${ui.taskMissing?'<div class="notice red">水瓶漏检已登记。该记录没有有效 6D 位姿，当前任务不能合格提交。</div>':''}<div class="right-label">已有有效位姿 · 六参数</div><div class="task-fields">${Object.entries(ui.taskPose).map(([k,v])=>`<label>${poseFieldLabels[k]}（${k}）<input type="number" step="0.001" data-picture-pose="${k}" value="${esc(v)}" ${ui.taskRemoved?'disabled':''}></label>`).join('')}</div><div class="footer-note">示例数值；坐标正方向、长度／角度单位及旋转表示待算法联调确认。步长仅用于原型演示。</div><div class="notice blue">仅修正已有实例。新增漏检物品须管理员在线重跑取得 pose。</div><div class="task-actions">${button('保存草稿','pictureSaveTask','mini')}${button('提交审核','pictureSubmit','primary',ui.taskMissing)}${ui.taskMissing?button('提交给管理员处理','pictureSendAdmin','mini'):''}</div>${ui.taskSaved?'<div class="footer-note">草稿已保存；算法原值保留。</div>':''}`}</aside></div></section>`}
document.addEventListener('click',e=>{
  const state=e.target.closest('[data-state]');if(state){setState(state.dataset.state);return}
  const task=e.target.closest('[data-task]');if(task){const v=task.dataset.task;ui.selectedTasks=task.checked?[...ui.selectedTasks,v]:ui.selectedTasks.filter(x=>x!==v);render();return}
  const analysisTask=e.target.closest('[data-analysis-task]');if(analysisTask){const v=analysisTask.dataset.analysisTask;ui.analysisTasks=analysisTask.checked?[...ui.analysisTasks,v]:ui.analysisTasks.filter(x=>x!==v);render();return}
  const target=e.target.closest('[data-remove]');if(target){const i=Number(target.dataset.remove),t=ui.targets[i];if(!t.persisted&&!t.id.trim()&&!t.name.trim()&&!t.desc.trim()){ui.targets.splice(i,1);ui.targetsSaved=false;render()}else{ui.removeIndex=i;openModal('deleteTarget')}return}
  const cap=e.target.closest('[data-cap]');if(cap){ui.cap=cap.dataset.cap;ui.state=ui.cap==='pose'?activePoseState():ui.legacyFile?'legacyUploaded':'legacyEmpty';ui.modal=null;render();return}
  const sec=e.target.closest('[data-section]');if(sec){ui.section=sec.dataset.section;ui.state=ui.section==='项目方案'?'scheme':ui.section==='预标注'?(ui.cap==='pose'?activePoseState():ui.legacyFile?'legacyUploaded':'legacyEmpty'):ui.state;ui.modal=null;render();return}
  const top=e.target.closest('[data-top]');if(top){ui.top=top.dataset.top;render();return}
  const label=e.target.closest('[data-labeltab]');if(label){ui.labelTab=label.dataset.labeltab;render();return}
  const a=e.target.closest('[data-action]');if(!a)return;
  const x=a.dataset.action;
  if(x==='prev'||x==='next'){const current=states.findIndex(([k])=>k===ui.state);const i=current<0?0:current+(x==='next'?1:-1);setState(states[Math.max(0,Math.min(states.length-1,i))][0]);return}
  if(x==='toggleStates'){ui.showStates=!ui.showStates;render();return}
  if(x==='goPreannotation'||x==='backConfig'){ui.top='配置';ui.section='预标注';ui.cap='legacy';ui.state=ui.legacyFile?'legacyUploaded':'legacyEmpty';render();return}
  if(x==='toggleSchemeMenu'){ui.schemeMenu=!ui.schemeMenu;render();return}
  if(x==='importLabels'){ui.schemeMenu=false;toast('标签方案的通用 JSON 导入沿用现有功能；本原型展示导入后的示例标签。');return}
  if(x==='exportLabels'||x==='editLabels'||x==='nav'){toast('沿用现有项目页面；本原型聚焦预标注配置。');return}
  if(x==='openUpload'){openModal('legacyUpload');return}
  if(x==='sampleJson'){ui.uploadCandidate='预标注.json';render();return}
  if(x==='confirmUpload'){if(!ui.uploadCandidate)return;ui.legacyFile=ui.uploadCandidate;ui.uploadCandidate='';ui.modal=null;ui.state='legacyUploaded';render();return}
  if(x==='legacyDownload'){toast('原型示意：下载当前 2D JSON 文件');return}
  if(x==='deleteLegacy'){openModal('deleteLegacy');return}
  if(x==='confirmDeleteLegacy'){ui.legacyFile=null;ui.modal=null;ui.state='legacyEmpty';render();return}
  if(x==='openLegacyAnalyze'){openModal('legacyAnalyze');return}
  if(x==='confirmLegacyAnalyze'){ui.legacyFile=null;ui.modal=null;ui.state='legacyRunning';const token=++ui.legacyToken;render();setTimeout(()=>{if(token!==ui.legacyToken)return;ui.state='legacyDone';render()},1000);return}
  if(x==='savePrompt'){if(!ui.enabled||!ui.prompt.trim())return;ui.promptSaved=true;render();return}
  if(x==='addTarget'){if(!ui.enabled)return;ui.targets.push({id:'',name:'',desc:'',on:true,persisted:false});ui.targetsSaved=false;render();return}
  if(x==='saveTargets'){if(!validTargets()){toast('请补齐目标 ID、名称和已启用物品的目标描述，确保 ID 唯一且至少启用一个物品');return}ui.targets=ui.targets.map(t=>({...t,persisted:true}));ui.targetsSaved=true;render();return}
  if(x==='confirmDeleteTarget'){if(ui.removeIndex!==null){ui.targets.splice(ui.removeIndex,1);ui.targetsSaved=false}ui.removeIndex=null;ui.modal=null;render();return}
  if(x==='confirmConfig'){
    if(!ui.enabled||!ui.prompt.trim()||!ui.promptSaved||!ui.targetsSaved||!validTargets()){toast('请先确认提示词并保存完整的物品清单');return}
    ui.confirmedSignature=configSignature();render();return;
  }
  if(x==='openPoseVerify'){if(!isConfirmed()){toast('请先确认描述配置');return}openModal('poseVerify');return}
  if(x==='confirmPoseVerify'){if(!isConfirmed()||ui.selectedTasks.length<1||ui.selectedTasks.length>5)return;ui.modal=null;runSimulation('verify');return}
  if(x==='showPreview'){ui.previewOpen=true;render();return}
  if(x==='closePreview'){ui.previewOpen=false;render();return}
  if(x==='toggleProjection'){ui.projection=!ui.projection;render();return}
  if(x==='openPoseAnalyze'){if(!isConfirmed()){toast('请先确认描述配置');return}ui.analysisRiskAccepted=false;openModal('poseAnalyze');return}
  if(x==='confirmPoseAnalyze'){if(!isConfirmed()||ui.analysisRange==='选定任务'&&!ui.analysisTasks.length||(analysisRisk()&&!ui.analysisRiskAccepted))return;ui.modal=null;runSimulation('analysis');return}
  if(x==='openStop'){ui.modal='stop';render();return}
  if(x==='confirmStop'){++ui.runToken;if(ui.runningKind==='verify')ui.validationStatus='terminated';if(ui.runningKind==='analysis'){ui.analysisStatus='terminated';ui.analysisSignature=ui.confirmedSignature}ui.runningKind=null;ui.modal=null;render();return}
  if(x==='retryPose'){if(!isConfirmed())return;openModal('poseAnalyze');return}
  if(x==='closeModal'){ui.modal=null;render();return}
});
document.addEventListener('change',e=>{
  if(e.target.id==='stateSelect'){setState(e.target.value);return}
  if(e.target.id==='errorVariant'){ui.analysisStatus=e.target.value;ui.analysisSignature=ui.confirmedSignature;render();return}
  if(e.target.id==='enabledSwitch'){ui.enabled=e.target.checked;render();return}
  if(e.target.id==='modelVersion'){ui.model=e.target.value;render();return}
  if(e.target.id==='jsonFile'){ui.uploadCandidate=e.target.files?.[0]?.name||'';render();return}
  if(e.target.id==='legacyModel'){ui.legacyModel=e.target.value;return}
  if(e.target.id==='poseRange'){ui.analysisRange=e.target.value;render();return}
  if(e.target.id==='acceptAnalysisRisk'){ui.analysisRiskAccepted=e.target.checked;document.querySelector('[data-action="confirmPoseAnalyze"]').disabled=!ui.analysisRiskAccepted||ui.analysisRange==='选定任务'&&!ui.analysisTasks.length;return}
  if(e.target.id==='targetPrompt'){render();return}
  if(e.target.dataset.target!==undefined){const i=Number(e.target.dataset.target),k=e.target.dataset.key;if(k==='on')ui.targets[i].on=e.target.checked;ui.targetsSaved=false;render();return}
});
document.addEventListener('input',e=>{
  if(e.target.id==='targetPrompt'){
    ui.prompt=e.target.value;ui.promptSaved=false;
    const save=document.querySelector('[data-action="savePrompt"]');if(save)save.disabled=!ui.enabled||!ui.prompt.trim();
    document.querySelectorAll('[data-action="openPoseVerify"],[data-action="openPoseAnalyze"]').forEach(b=>b.disabled=true);
    return;
  }
  if(e.target.dataset.target===undefined)return;
  const i=Number(e.target.dataset.target),key=e.target.dataset.key;
  if(key==='id'||key==='name'||key==='desc'){ui.targets[i][key]=e.target.value;ui.targetsSaved=false;document.querySelectorAll('[data-action="openPoseVerify"],[data-action="openPoseAnalyze"]').forEach(b=>b.disabled=true)}
});
document.addEventListener('change',e=>{if(e.target.id==='pictureTaskCategory'){ui.taskCategory=e.target.value;ui.taskSaved=false;render()}},true);
document.addEventListener('input',e=>{const key=e.target.dataset.picturePose;if(key){ui.taskPose[key]=e.target.value;ui.taskSaved=false}},true);
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(!a)return;const x=a.dataset.action;const names=['openPictureTask','backPictureConfig','pictureFalsePositive','pictureReportMissing','pictureResetPose','pictureSaveTask','pictureSubmit','pictureSendAdmin','simulatePictureRerun','pictureReviewApprove','pictureReviewReject'];if(!names.includes(x))return;e.stopImmediatePropagation();
  if(x==='openPictureTask'){window.location.href='./image-task.html';return}
  if(x==='backPictureConfig'){ui.state='poseComplete';render();return}
  if(x==='pictureFalsePositive'){ui.taskRemoved=!ui.taskRemoved;ui.taskSaved=false;render();return}
  if(x==='pictureReportMissing'){ui.taskMissing=true;ui.taskSaved=false;ui.state='poseTaskMissing';render();return}
  if(x==='pictureResetPose'){ui.taskPose={tx:'0.324',ty:'0.112',tz:'0.781',rx:'12.4',ry:'-3.2',rz:'88.0'};ui.taskSaved=false;render();return}
  if(x==='pictureSaveTask'){if(Object.values(ui.taskPose).some(v=>v===''||!Number.isFinite(Number(v)))){toast('六个参数必须是有效数字');return}ui.taskSaved=true;toast('草稿已保存，算法原值保留');return}
  if(x==='pictureSubmit'){if(ui.taskMissing){toast('漏检未补齐，不能合格提交');return}if(!ui.taskSaved){toast('请先保存草稿');return}ui.state='poseTaskReview';render();return}
  if(x==='pictureSendAdmin'){ui.state='poseTaskAdmin';render();return}
  if(x==='simulatePictureRerun'){ui.taskMissing=false;ui.taskSaved=false;ui.state='poseTaskEdit';toast('管理员在线重跑并重新应用示意，请标注员复核');return}
  if(x==='pictureReviewApprove'){toast('审核通过示意，后续沿用质检和验收');return}
  if(x==='pictureReviewReject'){ui.state='poseTaskEdit';ui.taskSaved=false;toast('已驳回，返回标注员修订');return}
},true);
render();
</script></body></html>
